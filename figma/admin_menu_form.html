<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin_shared.css">
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-brand"><span class="sidebar-brand-name">Monalisa Resto</span><span class="sidebar-brand-sub">Panel Administrasi</span></div>
    <div class="sidebar-section-label">Utama</div>
    <nav class="sidebar-nav">
        <a href="admin_dashboard.html"><i class="fas fa-gauge-high"></i> Dashboard</a>
        <a href="admin_menu.html" class="active"><i class="fas fa-utensils"></i> Manajemen Menu</a>
        <a href="admin_galeri.html"><i class="fas fa-images"></i> Manajemen Galeri</a>
        <a href="admin_konten.html"><i class="fas fa-file-alt"></i> Manajemen Konten</a>
        <div class="sidebar-section-label" style="margin-top:0.5rem;">Sistem</div>
        <a href="admin_akun.html"><i class="fas fa-user-shield"></i> Manajemen Akun</a>
        <a href="admin_log.html"><i class="fas fa-history"></i> Log Aktivitas</a>
    </nav>
    <div class="sidebar-footer"><a href="admin_login.html"><i class="fas fa-arrow-right-from-bracket"></i> Keluar</a></div>
</aside>
<div class="main-content">
    <header class="topbar">
        <div class="topbar-left"><div class="topbar-breadcrumb"><span>Admin</span><i class="fas fa-chevron-right" style="font-size:0.6rem;"></i><span class="topbar-title">Manajemen Menu</span></div></div>
        <div class="topbar-right">
            <a href="tamu_beranda.html" style="font-size:0.8rem; color: var(--text-muted); display:flex; align-items:center; gap:0.4rem;"><i class="fas fa-arrow-up-right-from-square" style="font-size:0.7rem;"></i> Lihat Website</a>
            <div class="topbar-user"><div class="topbar-avatar">A</div><span style="font-weight: 600;">admin</span></div>
        </div>
    </header>
    <div class="content-area">

<div class="page-actions">
    <h2>Tambah Menu Baru</h2>
    <a href="admin_menu.html" class="btn btn-secondary">Kembali</a>
</div>

<div class="card">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
        <div class="form-group">
            <label for="nama_menu">Nama Menu</label>
            <input type="text" id="nama_menu" class="form-control" value="Soto Kudus">
        </div>
        <div class="form-group">
            <label for="asal_daerah">Asal Daerah</label>
            <input type="text" id="asal_daerah" class="form-control" value="Bogor">
        </div>
        <div class="form-group">
            <label for="kategori">Kategori</label>
            <select id="kategori" class="form-control">
                <option>Soto &amp; Sup</option>
                <option>Nasi &amp; Utama</option>
                <option>Camilan</option>
                <option>Minuman</option>
                <option>Lainnya</option>
            </select>
        </div>
        <div class="form-group">
            <label for="harga">Harga (Rp)</label>
            <input type="number" id="harga" class="form-control" value="27500">
        </div>
    </div>

    <div class="form-group">
        <label for="deskripsi_singkat">Deskripsi Singkat (maks. 150 karakter)</label>
        <input type="text" id="deskripsi_singkat" class="form-control" value="Soto Kudus lezat khas Monalisa Resto.">
    </div>

    <div class="form-group">
        <label for="deskripsi_lengkap">Deskripsi Lengkap</label>
        <textarea id="deskripsi_lengkap" class="form-control" rows="4">Soto Kudus adalah salah satu menu favorit kami yang disajikan dengan cita rasa autentik. Kuah bening dengan ayam suwir dan bumbu rempah pilihan.</textarea>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
        <div class="form-group">
            <label for="bahan_utama">Bahan Utama</label>
            <input type="text" id="bahan_utama" class="form-control" value="Ayam kampung, bawang, rempah">
        </div>
        <div class="form-group">
            <label for="info_alergen">Info Alergen (opsional)</label>
            <input type="text" id="info_alergen" class="form-control" value="Tidak ada">
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
        <div class="form-group">
            <label for="foto">Foto Menu (JPG/PNG/WebP, maks. 2MB)</label>
            <input type="file" id="foto" class="form-control" accept="image/jpeg,image/png,image/webp">
        </div>
        <div class="form-group">
            <label for="status">Status Tampil</label>
            <select id="status" class="form-control">
                <option value="aktif" selected>Aktif</option>
                <option value="nonaktif">Nonaktif</option>
            </select>
        </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
        <a href="admin_menu.html" class="btn btn-secondary">Batal</a>
        <button class="btn btn-primary" style="padding: 11px 36px;">
            <i class="fas fa-save"></i> Simpan Menu
        </button>
    </div>
</div>

    </div>
</div>
</body>
</html>
