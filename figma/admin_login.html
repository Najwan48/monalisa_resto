<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin · Monalisa Resto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary:       #8B6914;
            --primary-dark:  #6A5010;
            --charcoal:      #1C1C1C;
            --text:          #2C2C2C;
            --text-muted:    #767676;
            --bg-warm:       #F4F1EA;
            --surface:       #FFFFFF;
            --border:        rgba(0, 0, 0, 0.08);
            --radius:        12px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-warm);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 70% 20%, rgba(139, 105, 20, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 10% 80%, rgba(139, 105, 20, 0.05) 0%, transparent 40%);
            z-index: -1;
        }

        .login-card {
            background: var(--surface);
            padding: 3.5rem;
            border-radius: var(--radius);
            box-shadow: 0 40px 100px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 3rem;
        }

        .login-brand h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            color: var(--charcoal);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .login-brand p {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--primary);
            font-weight: 600;
        }

        .form-group { margin-bottom: 1.5rem; }

        .form-group label {
            display: block;
            margin-bottom: 0.75rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            background: #FAFAF8;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            color: var(--charcoal);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background-color: var(--charcoal);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-brand">
        <h2>Monalisa Resto</h2>
        <p>Panel Administrasi</p>
    </div>

    <div>
        <div class="form-group">
            <label for="username">Nama Pengguna</label>
            <input type="text" id="username" class="form-control" placeholder="Masukkan username">
        </div>
        <div class="form-group">
            <label for="password">Kata Sandi</label>
            <input type="password" id="password" class="form-control" placeholder="Masukkan password">
        </div>
        <button type="button" class="btn-login">Masuk ke Dashboard</button>
    </div>
</div>

</body>
</html>
